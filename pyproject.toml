[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-team-dashboard"
dynamic = ["version"]
description = "Live CTF team dashboard: solved/unsolved tracking, category stats, time remaining."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CTF Team Dashboard contributors" }]
keywords = ["ctf", "security", "dashboard", "soc", "pentest"]
classifiers = [
  "Development Status :: 2 - Planning",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/yassinalkhulaqi/Cipher-CTF-notes"

[project.scripts]
ctf-team-dashboard = "ctf_team_dashboard.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ctf_team_dashboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["ctf_team_dashboard"]
omit = [
  "src/ctf_team_dashboard/__main__.py",
  "src/ctf_team_dashboard/seed.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "@overload",
]
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "SIM", "PT", "RUF"]
ignore = ["A003", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "DTZ005", "PT011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src"]
